<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Pixel Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-piano-intro-2525.mp3" type="audio/mp3">
    </audio>

    <div class="pixel-bg"></div>
    <div class="floating-hearts" id="hearts-container"></div>

    <div id="app-viewport">
        <section id="step1" class="step active">
            <h2 class="pixel-text">For my Forever Person...</h2>
            <div id="heart-trigger">
                <div class="heart-icon">❤️</div>
                <div class="ripple"></div>
            </div>
            <p class="tap-hint">TAP THE HEART</p>
            <div id="loader-ui" class="hidden">
                <div class="pixel-text">BOOTING LOVE...</div>
                <div class="pixel-loader-container"><div id="bar-fill"></div></div>
            </div>
        </section>

        <section id="step2" class="step hidden">
            <h1 class="pixel-text env-title">💌 Memory Gallery 💌</h1>
            <p class="envelope-subtitle">Open our precious moments...</p>
            <div class="envelope-grid">
                <div class="env-wrapper" onclick="handleEnvelope(this)"><div class="env-main"><div class="env-flap"></div><div class="env-letter"><img src="images/us1.jpg"></div><div class="wax-seal">❤️</div></div></div>
                <div class="env-wrapper" onclick="handleEnvelope(this)"><div class="env-main"><div class="env-flap"></div><div class="env-letter"><img src="images/us2.jpg"></div><div class="wax-seal">💕</div></div></div>
                <div class="env-wrapper" onclick="handleEnvelope(this)"><div class="env-main"><div class="env-flap"></div><div class="env-letter"><img src="images/us3.jpg"></div><div class="wax-seal">💖</div></div></div>
                <div class="env-wrapper" onclick="handleEnvelope(this)"><div class="env-main"><div class="env-flap"></div><div class="env-letter"><img src="images/us4.jpg"></div><div class="wax-seal">💝</div></div></div>
            </div>
            <button id="nav-to-pw" class="glow-btn hidden" onclick="nextStep()">Continue</button>
        </section>

        <section id="step3" class="step hidden">
            <div class="pixel-card expanded">
                <h2 class="pixel-text">Access Locked</h2>
                <p>Where was our first date?</p>
                <input type="text" id="pw-field" placeholder="Type secret...">
                <button class="glow-btn" onclick="verifyAccess()">Unlock</button>
            </div>
        </section>

        <section id="step4" class="step hidden">
            <div class="pixel-card expanded">
                <h2 class="pixel-text">Trivia Test</h2>
                <div class="quiz-item"><p>Favorite food?</p><input type="text" id="ans-food" placeholder="..."></div>
                <div class="quiz-item"><p>Favorite color?</p><input type="text" id="ans-color" placeholder="..."></div>
                <div class="quiz-item"><p>Dog's name?</p><input type="text" id="ans-dog" placeholder="..."></div>
                <button class="glow-btn" onclick="checkTrivia()">Verify</button>
            </div>
        </section>

        <section id="step5"
         class="step hidden">
            <div class="pixel-card expanded">
                <h2 class="pixel-text">Why I Love You</h2>
                <div class="slider-box"><p id="reason-text"></p></div>
                <div class="slider-controls">
                    <button class="arrow-btn" onclick="prevReason()">◀</button>
                    <span id="reason-count" class="pixel-text">1/5</span>
                    <button class="arrow-btn" onclick="nextReason()">▶</button>
                </div>
                <button id="nav-to-flowers" class="glow-btn hidden" onclick="nextStep()">Build Gift</button>
            </div>
        </section>

        <section id="step6" class="step hidden">
            <div class="pixel-card expanded bouquet-card">
                <h1 class="pixel-text">Make our Bouquet</h1>
                <div class="vase-station">
                    <div id="flower-bed"></div> 
                    <div class="vase-glass"></div>
                    <div class="ribbon">🎀</div>
                </div>
            </div>
            <div class="pixel-dock">
                <button class="flower-btn" onclick="spawnFlower('lily')">🌸</button>
                <button class="flower-btn" onclick="spawnFlower('rose')">🌹</button>
                <button class="flower-btn" onclick="spawnFlower('tulip')">🌷</button>
                <button class="flower-btn" onclick="spawnFlower('daisy')">🌼</button>
            </div>
            <button id="nav-to-final" class="glow-btn hidden" onclick="nextStep()">Done ❤️</button>
        </section>

        <section id="step7" class="step hidden">
            <div id="proposal-card" class="pixel-card expanded">
                <h1 id="typewriter-text" class="pixel-text big"></h1>
                <div class="dual-btns">
                    <button id="yes-btn" class="glow-btn" onclick="accept()">YES!</button>
                    <button id="runaway-no" class="glow-btn alt-btn" onmouseenter="dodgeNo(event)" ontouchstart="dodgeNo(event)">No</button>
                </div>
            </div>
            <div id="celebration-ui" class="hidden">
                <h1 class="pixel-text big pulse">I LOVE YOU!</h1>
                <img src="images/us1.jpg" class="final-img">
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
