<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catch the Heart — Mini Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="game-root">
        <div class="game-card">
            <div class="game-header">
                <h2 class="pixel-text">Catch the Heart</h2>
                <div class="game-stats">
                    <div class="score-bubble">Score: <span id="score">0</span></div>
                    <div class="timer-bubble">Time: <span id="time">20</span>s</div>
                </div>
            </div>
            <div id="game-area" class="game-area" aria-live="polite"></div>
            <div class="game-controls">
                <button id="start-btn" class="glow-btn">Start</button>
                <a class="glow-btn" href="index.html">Back</a>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
