<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SURPRISE QUIZ TEACHER!! — Mini Game</title>
    <link rel="stylesheet" href="style.css?v=18">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <!-- Animated Background Elements -->
    <div class="game-bg-hearts" id="game-bg-hearts"></div>
    <div class="game-bg-sparkles" id="game-bg-sparkles"></div>
    
    <!-- Corner Decorations -->
    <div class="game-corner-deco top-left">
        <svg width="80" height="80" viewBox="0 0 64 64">
            <ellipse cx="32" cy="32" rx="24" ry="20" fill="#fff" stroke="#222" stroke-width="2"/>
            <ellipse cx="20" cy="24" rx="5" ry="7" fill="#fff" stroke="#222" stroke-width="2"/>
            <ellipse cx="44" cy="24" rx="5" ry="7" fill="#fff" stroke="#222" stroke-width="2"/>
            <circle cx="26" cy="32" r="3" fill="#222"/>
            <circle cx="38" cy="32" r="3" fill="#222"/>
            <ellipse cx="32" cy="38" rx="4" ry="2" fill="#f9b"/>
            <circle cx="48" cy="18" r="6" fill="#ff1744" stroke="#222" stroke-width="2"/>
            <circle cx="52" cy="16" r="3" fill="#ffb3c1"/>
        </svg>
    </div>
    
    <div class="game-corner-deco bottom-right">
        <svg width="80" height="80" viewBox="0 0 64 64">
            <ellipse cx="32" cy="32" rx="24" ry="20" fill="#fff" stroke="#222" stroke-width="2"/>
            <ellipse cx="20" cy="24" rx="5" ry="7" fill="#fff" stroke="#222" stroke-width="2"/>
            <ellipse cx="44" cy="24" rx="5" ry="7" fill="#fff" stroke="#222" stroke-width="2"/>
            <circle cx="26" cy="32" r="3" fill="#222"/>
            <circle cx="38" cy="32" r="3" fill="#222"/>
            <ellipse cx="32" cy="38" rx="4" ry="2" fill="#f9b"/>
            <circle cx="16" cy="18" r="6" fill="#ff1744" stroke="#222" stroke-width="2"/>
            <circle cx="12" cy="16" r="3" fill="#ffb3c1"/>
        </svg>
    </div>
    
    <div class="game-root">
        <div class="game-card">
            <div class="game-header">
                <div>
                    <h2 class="pixel-text">SURPRISE QUIZ TEACHER!!</h2>
                    <p class="quiz-subtitle">Answer fast before the time runs out!</p>
                </div>
                <div class="game-stats">
                    <div class="score-bubble">Score: <span id="score">0</span></div>
                    <div class="timer-bubble">Time: <span id="time">60</span>s</div>
                </div>
            </div>

            <div id="game-area" class="game-area quiz-area">
                <div id="quiz-intro" class="quiz-panel quiz-panel-active">
                    <h3 class="pixel-text">Ready for a little trivia?</h3>
                    <p class="quiz-helper">You have 60 seconds to answer 15 questions about Philippine history.
                        Get at least 7 correct to win a cute teddy bear.
                    </p>
                    <button id="start-btn" class="glow-btn">Start Quiz</button>
                </div>

                <div id="quiz-container" class="quiz-panel hidden">
                    <div class="quiz-question pixel-text" id="quiz-question"></div>
                    <div class="quiz-options" id="quiz-options"></div>
                </div>

                <div id="quiz-result" class="quiz-panel hidden">
                    <h3 class="pixel-text" id="quiz-result-title"></h3>
                    <p id="quiz-result-message"></p>
                    <div id="teddy-bear"></div>
                    <button id="retry-btn" class="glow-btn">Play Again</button>
                </div>
            </div>

            <div class="game-controls">
                <a class="glow-btn" href="index.html">Back</a>
            </div>
        </div>
    </div>
    <script src="game.js?v=18"></script>
</body>

</html>
